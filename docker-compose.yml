services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_NAME:-pic}"
      MYSQL_USER: "${DB_USER:-pic}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  seed:
    build: .
    env_file: .env
    command: ["/app/importer"]
    environment: &app-environment
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-pic}"
      DB_USER: "${DB_USER:-pic}"
      DB_PASSWORD: "${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"
      REQUIRE_LICENSE_APPROVAL: "${REQUIRE_LICENSE_APPROVAL:-false}"
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]
  pic:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8198:8198"
    environment:
      <<: *app-environment
      HTTP_ADDR: "0.0.0.0:8198"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
